plugins { id 'com.android.application' }
android {
    namespace 'io.hmg.engineprobe'
    compileSdk 34
    useLibrary 'android.car'
    defaultConfig { applicationId 'io.hmg.engineprobe'; minSdk 31; targetSdk 34; versionCode 1; versionName '1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    sourceSets.main.java {
        srcDir '../../app/src/main/java'
        include '**/engineprobe/**', '**/CreatorTheme.java', '**/ThemeLinks.java', '**/SceneBackground.java', '**/WidgetDesign.java', '**/CreatorThemeChecks.java', '**/DDayWidget.java', '**/WeatherData.java', '**/WeatherChecks.java', '**/WidgetPlacement.java', '**/WidgetBoard.java', '**/WidgetBoardChecks.java', '**/WidgetShapeChecks.java', '**/ThemeClock.java', '**/ThemeStudio.java', '**/ThemePreview.java', '**/WidgetShelf.java', '**/WidgetCatalogChecks.java', '**/SnapMath.java', '**/CalendarWidget.java', '**/BatteryWidget.java', '**/WorkshopLibrary.java', '**/ThemePresets.java', '**/ThemeHubChecks.java', '**/InstalledThemes.java'
    }
}

dependencies {
    implementation "ai.pleos.playground:Vehicle:2.3.2"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
}
android.sourceSets.main.java.include '**/AppUi.java', '**/UiMotion.java', '**/UiMotionChecks.java'
android.sourceSets.main.java.include '**/wallpaperapp/BuildConfig.java'

dependencies { implementation "ai.pleos.playground:NaviHelper:3.0.5"; implementation "ai.pleos.playground:FusedLocation:1.1.3" }
android.sourceSets.main.java.include '**/VehicleWidgets.java', '**/AmbientMatch.java', '**/Mood.java', '**/PullDownPanel.java', '**/MarketPreview.java'
android.sourceSets.main.java.include '**/BundledThemes.java'
