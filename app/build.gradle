plugins { id 'com.android.application' }
// Release signing comes from a file outside the source tree, named in local.properties (release.signing=...). Without it the release build is unsigned.
def releaseKey = new Properties()
def localProps = new Properties()
if (rootProject.file('local.properties').isFile()) rootProject.file('local.properties').withReader('UTF-8') { localProps.load(it) }
def releaseKeyFile = localProps.getProperty('release.signing') ? rootProject.file(localProps.getProperty('release.signing')) : null
if (releaseKeyFile?.isFile()) releaseKeyFile.withReader('UTF-8') { releaseKey.load(it) }
android {
    namespace 'io.hmg.wallpaperapp'
    buildFeatures { buildConfig true }
    compileSdk 34
    useLibrary 'android.car'
    androidResources { noCompress += ['mp4'] }
    defaultConfig {
        applicationId 'io.hmg.wallpaperapp'
        minSdk 31
        targetSdk 34
        versionCode 40
        versionName '1.38-preview'
    }
    signingConfigs {
        if (releaseKey.storeFile) release {
            storeFile new File(releaseKeyFile.parentFile, releaseKey.storeFile)
            storePassword releaseKey.storePassword
            keyAlias releaseKey.keyAlias
            keyPassword releaseKey.keyPassword
        }
    }
    // Contest build: src/release adds the bundled AI web themes; Workshop presets stay out of sight (BundledThemes.present). Debug is unchanged.
    buildTypes {
        release { if (releaseKey.storeFile) signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
}
// Contest build leaves out the three built-in video backgrounds and their stills: they were authored in the Wallpaper Engine editor and its output terms are unconfirmed (VIDEO_LICENSE.txt). Sources stay in src/main for debug and the PC studio.
tasks.matching { it.name == 'mergeReleaseAssets' }.configureEach { task ->
    task.doLast {
        ['background.mp4', 'VIDEO_LICENSE.txt', 'themes/cafe.mp4', 'themes/coast.mp4', 'themes/preview-0.jpg', 'themes/preview-1.jpg', 'themes/preview-2.jpg'].each { new File(task.outputDir.get().asFile, it).delete() }
    }
}
androidComponents {
    onVariants(selector().withBuildType('release')) { variant ->
        variant.outputs.each { it.versionCode.set(42); it.versionName.set('1.39') }
    }
}

dependencies {
    implementation "ai.pleos.playground:Vehicle:2.3.2"
    implementation "ai.pleos.playground:NaviHelper:3.0.5"
    implementation "ai.pleos.playground:FusedLocation:1.1.3"
    implementation "androidx.dynamicanimation:dynamicanimation:1.1.0"
}
